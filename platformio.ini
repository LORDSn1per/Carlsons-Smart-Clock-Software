; ============================================================================
;  SmartClock 3.46 - PlatformIO / VS Code project
; ----------------------------------------------------------------------------
;  Converted from the Arduino IDE sketch "MyClock_2.89.ino"; the conversion
;  itself is what bumped the firmware version to 2.90.
;
;  Original Arduino IDE board settings this env reproduces:
;    Board            : ESP32 Dev Module
;    Core             : esp32 by Espressif Systems v2.0.12
;    Flash Size       : 4 MB (32 Mb)
;    Partition Scheme : Minimal SPIFFS (1.9 MB app with OTA / 190 KB SPIFFS)
;    CPU Frequency    : 240 MHz
;    Core Debug Level : None
;    Arduino runs on  : Core 1     Events run on : Core 0
;
;  >> IMPORTANT: this project must stay on the Arduino-ESP32 2.x line. <<
;     The vendored ESP32-HUB75-MatrixPanel-I2S-DMA driver pokes the I2S
;     peripheral registers directly (i2s_dev_t, I2S0/I2S1, I2S_NUM_MAX,
;     PIN_FUNC_SELECT ...). ESP-IDF 5 - which Arduino-ESP32 3.x is built on -
;     removed all of those from the legacy I2S driver, so the panel driver
;     does not compile there. Moving to core 3.x means first upgrading the
;     HUB75 library to a version that uses the LCD_CAM/GDMA peripheral.
;
;  Docs: https://docs.platformio.org/page/projectconf.html
; ============================================================================

[platformio]
name           = SmartClock
description    = ESP32 HUB75 LED matrix smart clock (weather, world map, web UI)
default_envs   = esp32dev
src_dir        = src
lib_dir        = lib
; NOTE: there is deliberately no data_dir / SPIFFS image any more. The settings
; page is compiled into the firmware (web/index.html -> src/WebPage_gz.h), so
; `pio run -t uploadfs` is no longer part of the workflow -- and running it
; would overwrite the SPIFFS partition, erasing saved settings and WiFi
; credentials. SPIFFS is still used at runtime for /settings.json.

[env:esp32dev]
; espressif32 6.12.0 ships Arduino-ESP32 2.0.17, the last and best-tested
; release of the 2.x line and the closest available match to the 2.0.12 the
; Arduino IDE build used. Pinned so the build stays reproducible.
platform  = espressif32@6.12.0
board     = esp32dev
framework = arduino

; ---------------------------------------------------------------- build ----
board_build.partitions      = partitions/min_spiffs.csv
board_build.filesystem      = spiffs
board_build.flash_mode      = qio
board_build.f_flash         = 80000000L
board_build.f_cpu           = 240000000L

; Before each build, gzip web/index.html into src/WebPage_gz.h so the settings
; page ships compressed (~93 KB -> ~16 KB over the air; see scripts/build_web.py).
; After each build, merge bootloader + partitions + boot_app0 + app into one
; flashable image and drop a copy in ../BIN/ (see scripts/merge_firmware.py).
extra_scripts =
    pre:scripts/build_web.py
    post:scripts/merge_firmware.py

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_RUNNING_CORE=1
    -DARDUINO_EVENT_RUNNING_CORE=0
    ; ArduinoJson 7 still provides DynamicJsonDocument, but marks it deprecated.
    ; The sketch uses it throughout; silence the noise rather than churn 3000
    ; lines of working code.
    -Wno-deprecated-declarations

; ------------------------------------------------------------ libraries ----
; Locally patched / unpublished libraries live in lib/ and are picked up
; automatically:
;   Adafruit_GFX                     - modified, plus this project's fonts
;   ESP32-HUB75-MatrixPanel-I2S-DMA  - modified R/G/B pin mapping
;   qrcoderm                         - not on the registry
;   EasyButton                       - touch variant removed
; Registry versions below are pinned to what the Arduino IDE build used.
lib_ldf_mode = chain+
lib_deps =
    bblanchon/ArduinoJson @ 7.4.2
    adafruit/RTClib @ 2.1.4
    adafruit/Adafruit AHTX0 @ 2.0.5
    adafruit/Adafruit BusIO @ 1.17.0
    adafruit/Adafruit Unified Sensor @ 1.1.15
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; -------------------------------------------------------------- upload -----
upload_speed  = 460800
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; ---------------------------------------------------------------- OTA ------
; The sketch runs ArduinoOTA. To flash over WiFi instead of USB, set the
; clock's IP address below and run:  pio run -e ota -t upload
[env:ota]
extends          = env:esp32dev
upload_protocol  = espota
; upload_port    = 192.168.1.xxx
